<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>의사선택자</title>
</head>
<body>

    <!-- has() 특정요소를 가지고 있는 요소를 선택 -->

    <div>
        <p>hello</p>
        
    </div>

    <div>
        <a href="">링크</a>
    </div>

    <style>
        div:has(a){
            background-color: lightblue;
        }
    </style>

    <hr>

    <!-- has 를 사용 하는 예시 -->
    <!--  메뉴항목 위로 마우스 커서를올렸을때 해당 메누가 잘 보여지도록 나머지요소들을 반투명하게 -->
    <nav>
        <ul>
            <li><a href="">home</a></li>
            <li><a href="">about</a></li>
            <li><a href="">port</a></li>
            <li><a href="">contact</a></li>
        </ul>
    </nav>

    <style>
        nav ul{
            background-color: black;
            display: flex;
            list-style: none;
            flex-direction: row;
            justify-content: space-evenly;
            padding: 1rem;
        }
        nav ul li a{
            color: white;
            text-decoration: none;
            display: inline-block;
        }
        nav ul li a:hover{
            color: orange;
        }
        nav:has(a:hover) a:not(a:hover){opacity: 0.4;}
 

    </style>
</body>
</html>
