<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>function</title>

    <!-- 내부스크립트 -->
     <script>
        // 1. 함수 정의 및 호출(선언적 함수)
        function aaa(){
            document.write('aaa function <br>');
            document.write('hello <br>')
        }

        aaa(); // 함수 호출 
        aaa();

        // 특이한점.. 함수정의보다 호출문이 먼저 있어도 됨
        // js는 script 영역의 코드를 실행하기 전에 해당 영역의 선언적 함수 들을 먼저 읽어들여 인식함
        bbb();

        function bbb(){
            document.write('bbb function ..<br>')
        }

        ccc(); //error
        // 에러가 발생하면 사용자가 보는 body 영역에는 아무 표기가 없음
        // 대신 브라우저의 개발자도구의 콘솔창에 에러가 표기됨
        // 에러가 발생하면 그 스트립트 영역은 더이상 코드를 진행하지 않음
        document.write('첫 번째 스크립트 영역 종료 <hr>')
        //  단 다른 스크립트는 별도로 이어서 실행됨
     </script>
    <!--  또 다른 스크립트가 있을 수 있다. -->

    <script>
        //  위영역에 있던 선언적 함수 를 호출 할 수 있나?
        bbb();
        function ccc(){
            document.write('ccc function..<br>')
        }

    </script>

    <!-- 2.함수 파라미터에 값을 전달해보기 -->
    <script>
        document.write('<hr>')
        // 값 하나를 전달 받는  함수 정의
        function ddd(a){ //주의!  여기에 var = a 처럼 파라미터(매개변수)를 만들때에는 var 키워드가 있으면안됨
            document.write(a + '<br>')
        }
        // 호출하면서 값 전달하기
        ddd(100);
        ddd('sam');
        ddd(new Date());
        // 값을 전달 하지 않으면? 
        ddd(); //undefind;
        document.write('<br>')

        // 매개변수(파라미터) 2개짜리 함수
        function eee(a,b){
            document.write(a + ',' + b + '<br>');
            // 혹시 a 와 b 에 값이 전달 되지 않으면 에러 안내문구 보여주기 보여주고 덧셈연산을 하지 않도록 함수의 동작을 멈추기
            if (a==undefined || b==undefined){
                document.write("두개 이상의 수를 모두 전달 해주세요.<br>")
                return
            }
            
            // 전달받음 두 매개변수의 값들을 것셈하여 결과 출력하기
            var c = a + b
            document.write('결과: ' + c +'<br>')
        }
        // 
        eee(50, 30);
        eee(50);

        // 같은 이름의 함수를 또 정의하면 덮어쓰기 됨 (즉 마지막에 정의한 함수내용으로 덮어써짐.)
        // 위에서 먼저 호출했던 eee (50,30 ) 문도 영향을 받는다.

        function eee(){
            document.write('같은 이름을 또 써버린 eee  function<br>')
        }
        eee();

    </script>
    <!-- 3. 함수 실행 후 결과를 리턴 받기 -->
    <script>
        document.write('<hr>')

        function ggg(){
            // return true; // ggg()함수를 호출한 위치로 1000이라는 값을 가지고 돌아간다.
            return new Date();
        }

        var n = ggg(); //ggg함수의 코드가 실행 되고 그 리턴 값이 이 자리로옴 
        document.write(n + '<br>')
        document.write("<br>")
        // 여러개의 값을 한번에 리턴 할 수 는 없다.
        function hhh(){
            // return 10,20 // 여러개의 값을 전달 하면 값중 마지막 값 1개만 리턴됨 
            // 여러개의 값을 리턴하려면 배열로 묶어서 리턴해야함
            return [10,20,30,]
        }

        var m = hhh();

        document.write(m + '<br>')
        document.write(m[0] + '<br>') // 이렇게 인덱스번호로 하나씩 뽑을 수있다.

    </script>

    <!-- 함수의 매개변수 기본값 -->
    <script>
        document.write('<hr>')

        function sss(a= 5){ // parameter default value 기본값 
            document.write(a + '<br>')
        }
        sss(10000);
        sss();

        function ttt(a=1,b=2){
            document.write(a+',' + b + '<br>');

        }
        ttt(10,20);
        ttt(100);
        ttt();
        // v파이썬과 다른 점 , 값을 전달 할 때 파라미터 명을 지정 할 수 없음.[순서변경 안됨 - 파이썬은 됨]
        ttt(b=1000, a=50); // 순서대로 전달됨. 


    </script>
    <!-- 내장된 arguments 배열 변수 거의 사용하지 않는다. -->

    <script>
        document.write('<hr>');
        // arguments 배열 : 매개 변수를 자동으로 저장하는 내장된 배열 변수

        function add(){
            document.write('전달된 값의 개수: ' + arguments.length+ "<br>");
            // 전달 된 각 값들은 반복문으로 arguments 의 요소들에 접근.

            for (n=0;n<arguments.length;n++){
                document.write(arguments[n]+',')
            }
            document.write('<br>')
        }
        add();
        add(10);
        add(10,20);


    </script>
    <!-- 지역 번수와 전역 변수  -->
    <script>
        document.write("<hr>")
        // 지역변수 : 함수 안에서 var 키워드로 만든 변수
        // 전역변수 : 함수 밖에서 var 키워드로 만들거나 함수 안에서 var 키워드 없이 만든 변수

        // 지역변수는 변수를 만든 그 함수영역 안에서만 인식 되는 변수
        // 전역변수는 이 스크립트 안에 어디서든 인식 가능한 변수


        var name = 'sam' // 전역변수 함수밖에 있다.

        function mmm(){
            var num = 10; // 지역변수
            document.write('함수 안 지역변수 num:' + num +'<br>')
            document.write('함수 안 전역변수 name:' + name + '<br>')
            // 함수 안에서 전역 변수를 만들고 싶다면? var 키워드 없이 만들면된다.
            address = 'seoul'; // 전역변수 이거 권장하지 않는다 
            document.write('함ㅅ 안 전역변수 address: ' + address + '<br>')
        }
        mmm();
        // document.write('함수 밖 지역변수 num:' + num + '<br>')//error
        document.write('함수 밖 전역변수 num:' + name + '<br>')
        document.write('함수 밖 전역변수 address: ' + address + "<br>")
        document.write("<br>");

        //지역변수에서 지역이라는 뜻은 함수의 {영역을 의미한다.}
        // 그래서 다른 {}영역은 지역으로 인식하지  않는다.
        if (true){
            var tel = '010-1234-5678';
            document.write('조건문 안 tel' + tel + "<br>")
        }
        document.write('조건문 밖 tel' + tel + "<br>")


        //자바스크립트의 버전 에크마 6 버전에서 는 
        //새로등장한  let, const  는 {}는 모두 지역으로 인식함

    </script>
    <!-- 이름이 없는 함수 : 익명함수  -->
    <script>
        document.write("<hr>")
        // show() // error
        // 익명함수는 선언적 함수가 아니기에 먼저 읽지않는다 그렇기에 함수정의보다 호출이 먼저 있으면 에러난다.
        //익명함수는 반드시 선언하면서 변수에 넣어야 함..
        var show = function(){
            document.write('익명함수')
        }
        document.write(show + '<br>');// show 변수가 저장하고 있는 함수 코그다 출력됨
        //변수의 이름을 함수 이름처럼 호출 할 수 있음
        show();

    </script>

    <!--함수를 변수에 대입할 수 있기에 다른 변수에도 함수코드를 넘겨줄 수 있음  -->
    <script>
        document.write("<hr>")
        var sss = function(){
            document.write('sss funoction...<br>')

        }

        var ttt = sss; // sss가 가지고 있는 함수 코드를 ttt 변수가 저장
        // ttt 는 함수 코드를 가지고 있으니 변수명을 마치 함수 이름처럼 사용하여 호출 가능..
        ttt();

        // 일반 변수 말고 .. 다른 함수의 매개변수(parameter)에 sss 함수코드를 전달 할수도 있다.
        function www(f){
            //f 가 함수를 가지고 있으니 함수명처럼 호출 가능
            f();
        };
        www(sss)//www함수를 호출하면서 sss 가 가진 함수 코드를 전달 하면 f 라는 매개변수가 받음.
        // 같은 함수를 호출하면서 다른 함수를 전달 할 수도 있다.
        www(function(){
            document.write('내것도 출력해..<br>')
        });

        // 같은 기능 함수 www 를 호출하면서도 서로 다르게 동작하도록 기능함수를 다르게 전달하는 형태.
        //GUI 에서 버튼 클릭시 다른 동작이 수행되도록 할 때 매우 많이 활용됨.
        // 이렇게 다른 함수를 파라미터로 받아 대신 실행해 주는 함수를 고차함수라고 부른다.
    </script>
