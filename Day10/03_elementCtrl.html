<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>element control</title>
    <!-- 내부스크립트 작성 -->
    <script>
// 1) 이미지를 변경하는 코드가 작성된 영역  
        function changeImage(){
            // image요소를 찾아와서 그 안의 속성 값src를 변경하겟다.-css 가 아니니 선택자 사용이 불가하다.
            // body 영역 안에 있는 요소를 찾는 기능이 document에 존재함.
            var img = document.getElementById('aa');
            img.src ='./image/paris.jpg';
            img.alt = 'paris image' 

        }
// 2) html요소의 특정 스타일을 변경하는 기능함수
        function changeColor(){
            // h2요소를 찾아서 배경색(스타일) 변경
            // 태그이름으로 찾아보기
            var h2s = document.getElementsByTagName('h2');//태그이름찾기는 여러개 일수도 있어서 무조건 배열로 찾아준다.
            var h2 = h2s[0];// 요소가배치된 순서래도 0번부터
            
            h2.style.backgroundColor='yellow';
            h2.style.color='red';
            h2.style.border='2px solid blue'
        }
// 3) input 요소의 값 제어
        function cal(){
            var in1 =document.getElementsByName('in1')[0];
            var in2 = document.getElementsByName('in2')[0];

            // input 요소에 써있는 값을 얻어오기
            var num1 = in1.value;
            var num2 = in2.value;

            // 두 수의 덧셈
            var result = num1 + num2
            var result = parseInt(num1) + parseInt(num2);

            var in3 = document.getElementsByName('in3')[0];
            in3.value = result;
        }
    </script>


</head>
<body>
    <!-- 보통의 js 함수는 버튼 크릭 같은 이벤트에 따라 처리할 작업을 써놓은 코드영역이다. -->

    <!-- 1) 이미지 변경 -->
    <img src="./image/newyork.jpg" alt="newyork" width="200px" id="aa">
    <button onclick="changeImage()">change image</button>
    <hr>

    <!-- 2) 특정요소의 스타일 변경-->
    <h2>this is heading element</h2>
    <button onclick="changeColor()">change background color of h2</button>
    <hr>

    <!-- 3) input 요소의 값 제어 -->
    <input type="text" name="in1"><br>
    <input type="text" name="in2"><br>
    <button onclick="cal()">덧셈계산</button><br>
    <input type="text" name="in3" placeholder="결과"><br>
</body>
</html>
