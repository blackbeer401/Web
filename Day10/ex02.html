<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let num1 = prompt('비교할 첫 번째 숫자');
        let num2 = prompt('비교할 두 번째 숫자');
        if(num1 !== null &&num2 !== null){
            num1 = parseInt(num1);
            num2 = parseInt(num2);
            if(num1>num2){
                alert(`${num1}이 ${num2}보다 더 큽니다.`)
                
            }else if(num1<num2){
                alert(`${num2}이 ${num1}보다 더 큽니다.`)
            
            }else{
                alert(`${num1}과 ${num2}는 같은 수 입니다.`)
            }
        }

    </script>
</head>

</body>
</html>
