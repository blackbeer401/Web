<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>animation</title>
        <style>
            #aa{
                background-color: green;
                width: 50px;
                height: 50px;
                border-radius: 25px;

                position: absolute;

                /* 애니매니션 적용*/
                animation-name: bounse;
                animation-duration: 3s;
                animation-iteration-count: 5;
                animation-timing-function: ease;
            }

            /* 애니매이션장면들 만들기 */
            @keyframes myanim
            {
                0%{left: 0px; top: 0px;}
                50%{left: 200px; top: 0px;}
                100%{left: 0px; top: 0px;}
            }
            @keyframes bounse
            {
                0%,100%{bottom: 0px; left: 0px;
                    nimation-timing-function: ease-out;}
                50%{
                    bottom: 200px;
                    animation-timing-function: ease-in;

                }
            }

            
        </style>
    </head>
    <body>
        <div id="aa"></div>
    </body>
</html>
