<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>layout</title>

        <style>
            #wrapper{
                width: 600px;
                border: 1px solid black;
                margin-left:auto; margin-right: auto;
            }

            #header{
                background-color: yellow;
                width: 100%;
                height: 3em;
                box-sizing: border-box;
            }
            #nav{
                background-color: pink;
                width: 30%;
                height: 150px;
                float: left;
            }
            #main{
                background-color: aquamarine;
                width: 70%;
                height: 150px;
                float: left;
            }
            #footer{
                background-color: black;
                color: white;
                width: 100%;
                height: 50px;
                clear: both;
            }
        </style>
    </head>
    <body>
        
        <div id="wrapper">   
            <div id="header">
                <header>header</header>
            </div>
            <div id="nav">
                <nav>nav</nav>
            </div>

            <div id="main">
                content

            </div>

            <div id="footer">
                <footer>footer</footer>
            </div>

        </div>

    </body>
</html>
