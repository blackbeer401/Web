<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>submenu</title>

    <style>

        *{margin: 0; padding: 0;}
        ul{list-style: none;}
        nav{
            height: 30px;
            background-color: lightgreen;

        }
        nav ul.menu>li{
            display: inline-block;
            border: 1px solid blue ;
            padding: 5px 10px;
            margin: 10px;
        }

        nav ul.submenu{
            border: 1px solid red;
            display: none;
            position: absolute;
        }
        nav li.menu_item:hover .submenu{
            display: block;
        }
    </style>
</head>
<body>

    <nav>
        <ul class="menu">
            <li class="menu_item">
                HOME
                <ul class="submenu">
                    <li>111</li>
                    <li>222</li>
                    <li>333</li>
                </ul>
            </li>
            <li class="menu_item">
                Service
                <ul class="submenu">
                    <li>1</li>
                    <li>2</li>
                    <li>3</li>
                </ul>
            </li>
            <li class="menu_item">
                MAIN
                <ul class="submenu">
                    <li>1</li>
                    <li>2</li>
                    <li>3</li>

                </ul>
            </li>
            
        </ul>
    </nav>

    
</body>
</html>
