<!DOCTYPE html>

        <title>뷰포트</title>

        <!-- 데스크탑 브라우저는 창의 크기에 따라 너비가 맞추어 변경된다. -->
        <!-- 모바일 브라우저는 디바이스의 크기와 상관없이 980px로 너비를 인식한다.그렇기에 css로 적용한 너비가 다르게 인식된다.(즉 작게 보여짐) -->
