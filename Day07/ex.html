<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- 외부스타일시트 -->
     <link rel="stylesheet" href="./ex.css">

</head>
<body>
    <div id="container">
        <div class="toolbar">
            <img class="toolbarimg" src="./imgs_company/back.png" alt="back">
            <button class="toolbarbutton">문의하기</button>
        </div>
        <h2>
            <span class="blue">2026년 기준으로 </span> 본인이 해당하는 조건이 있다면 모두 고르세요
        </h2>

        <div class="option_container">
            <div class="option">
                <img src="./imgs_company/ring.png" alt="배우자">
                <p>배우자가 있어요</p>
            </div>
            <!-- 띄어쓰기를 통해서 여러개의 클래스명 지정이 가능하다. -->
            <div class="option selected">
                <img src="./imgs_company/ring.png" alt="세대주">
                <p>주민등록상 세대주입니다.</p>
            </div>
            <div class="option">
                <img src="./imgs_company/ring.png" alt="장애인">
                <p>장애인입니다.</p>
            </div>
            <div class="option">
                <img src="./imgs_company/ring.png" alt="가족중 장애인">
                <p>가족중에 장애인이있어요</p>
            </div>
            <div class="option">
                <img src="./imgs_company/ring.png" alt="위탁아동">
                <p>위탁아동이 있어요</p>
            </div>

        </div>
        <button class="nextbtn">다음</button>



    </div>




    
</body>
</html>

<!-- 모바잉 UI 샘플 사진들이 제공되는 사잍 wwit  -->
