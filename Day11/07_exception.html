<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예외처리</title>
    <script>
        document.write("예최 처리에 대해 알아봅니다." + "<br>")
        // JS는 에러가 발생하면 그 자리에서 코드 실행이 멈춤.
        // aler('aaa');
        // 예외처리 문법 try()...... catch
        // 파이썬에서는 try... except 였다.
        // 이걸 사용하면 예외가 밸생해도 다운되지 않고 다음 코드들을 싱핼시킴
        try{
            aler('aaa')
        }catch(error){
            document.write("예외가 발생했어요 ..+<br>");
        }

        // 예외가 발생하든 안하든 무조건 실행되는 영역 finally
        try{
            // aaa()
            document.write("이건정상<br>")
        }catch(error){
            document.write("예외 발생: " + error + "<br>" )
        }finally{
            document.write("여기는 무조건 실행<br>")
        }   
        //finally 는 네트워크 연결 작업같은 곳에서 전송여부와 상관없이 
        // 서버 연결을 종료하는 코드등을 작성하는 목적으로 사용함

        document.write('script종료<hr>');

        // 예외가 아닌데 억지도 예외로 만들어서 던지는 문법 throw.[파이썬에서는 raise 라고 햇었음]
        try{
            var a = 10
            var b = 20
            var c = a-b 
            if(c<0){
                throw "음수는 나오면 안됨" // 예외가 발생한걸로 인지 
            }

            document.write("결과: "+ c + "<br>")
        }catch(e){
            document.write("에러<br>")
        }


    </script>
</head>
<body>
    
</body>
</html>
