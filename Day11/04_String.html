<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String</title>
    <script>
        // 3. String 생성자 함수 문자열 처리에 관련된 여러가지 기능설계도 

        // 기초타입 string과 구별
        var a = 'sam'
        var b = new String('sam');
        document.write(typeof(a) + "<br>");
        document.write(typeof(b) + "<br>");
        document.write((a===b) + "<hr>");

        // String 의 유용한 기능들
        var s = "Hello world";
        // 1) 글자수를 가지고 있는 멤버 변수
        document.write(s.length+"<br>");

        // 2) 대소문자 변환기능 
        document.write(s.toUpperCase() + "<br>");
        document.write(s.toLowerCase() + "<br>");
        document.write(s +"<br>"); // 원본은 그대로 

        // 3) 글씨 결합하기
        document.write(s.concat('Nice')+"<br>");
        document.write(s + "<br>");
        // 문자열의 결합은 매우 많이 사용하지만 concat은 많이 사용하지 않는다.
        // 문자열의 + 결합 연산자를 더 많이 사용한다.

        // 4) 특정 문자가 있는 위치번호(index번호 0,1,2,3)얻어오기
        document.write(s.indexOf('world') + "<br>"); // 해당 글자의 첫 글자 자리번호
        document.write(s.indexOf('sss') + "<br>");// 못찾으면 -1
        document.write(s.indexOf('World') + "<br>"); // 대소문자 구별이 안되기에 -1 로 표기됨 
        // 대소문자 구별 없이 검색하고 싶다면? 
        // document.write(s.indexOf(/worLD/i) + "<br>"); // 슬래시로 문자열을 쓰는 방식 (정규 표현식 -- 추후수업예정)

        // 5) 문자열 안에 원하는 문자를 찾아서 검색하여 추출(문자탐색 match) 
        var str = "Hello world! Nice to meet you 안녕하세요 반갑습니다. Nice work nice study."

        var word = str.match('Hello');
        document.write('검색글자 : ' + word + "<br>");

        var word = str.match('Good'); //못찾으면 null
        document.write('검색글자 : ' + word + "<br>");
        // 대소문자 구병? 
        var word = str.match('hello');
        document.write('검색글자 : ' + word + "<br>");
        
        // 대소문자 구별 없이 검색하고 싶다면? 민감하게 검색하지 않도록 옵션
        document.write(s.match(/worLD/i) + "<br>"); // 슬래시로 문자열을 쓰는 방식 (정규 표현식 -- 추후수업예정)

        // 여러개의 같은 문자가 있을때 찾아지는지.
        var words = str.match(/Nice/);
        document.write("탐색된 글자들: " + words + "<br>");

        // 여러개를 찾고 싶다면? 전체에서 검색하도록 global 옵션 주기
        var words = str.match(/Nice/g);
        document.write("탐색된 글자들: " + words + "<br>");

        // 대소문자 구별 없이 모든 같은 문자들을 탐색하려면 옵션 2개 모두 사용 
        var words = str.match(/Nice/ig);
        document.write("탐색된 글자들: " + words + "<br>");

        document.write("<hr>")

        // 6) 문자 바궈치기. replace
        var s = "Helo world";
        document.write(s.replace("world", "web") +"<br>" );// 원본은 그대로 

        document.write(s.replace("nice", "web") + "<br>") // 없는 글자를 바꾸려 하면 그냥 원본 그대로 

        document.write(s.replace("worLD", "web") + "<br>")
        document.write(s.replace(/worLD/i, "web") + "<br>")



        //여러개의 단어를 동시에 모두 바꾸려면?

        var str = 'hello world . nice world good world bad world';
        document.write(str.replace("world", "AI") + "<br>")
        document.write(str.replace(/world/ig, "AI") + "<br>")

        // 문자열 사이 사이에 있는 모든 공백 문자를 없앨 때에도 활용됨
        var result = str.replace(/ /ig,""); // 공백문자를 빈 문자열로 바꾸기..
        document.write(result+"<hr>")


        // 7) 문자열을 특정 문자 기준으로 잘라서 배열로 리턴 해주는 기능 csv 파일 분석에 많이 활용
        var s = 'one, two , three, four, five';
        var aaa = s.split(","); //,를 기준으로 자르기
        document.write("요소의 갯수: "+  aaa.length +"<br>" );

        document.write(aaa[0] + "<br>");
        document.write(aaa[1] + "<br>");
        document.write(aaa[2] + "<br>");
        document.write(aaa[3] + "<br>");
        document.write(aaa[4] + "<br>");
    </script>




</head>
<body>
    
</body>
</html>
