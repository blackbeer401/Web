<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>variable</title>

    <!-- 내부스크립트로작성 -->

    <script>
        // 이영역은 js 의 문법체계를 따름
        // 변수가 저장한 데이터의 종류 (자료형)
        // 1. 수치형: number 타입 정수와 실수

        // 2. 문자형: string '' "" ``

        // 3. 논리형: boolean true, false(파이썬과 다르게 소문자)

        // 4. 객체형: object, 내장, 함수, new키워드
        
        // 5. undefiend : 값이 없는 변수의 자료형

        // 기본자료형(수치,문자, 논리)를 저장하는 변수선언
        var a;
        // 변수에 값 대입하기
        document.write('<hr>');
        a =10;
        document.write(a)
        document.write('<br>')


        var b= 'aaa'
        document.write('bbb')
        document.write('<br>')

        var c = true

        document.write(c)
        document.write('<br>')

        //객체로 저장해보기
        var d =new Date()

        document.write(d)
        document.write('<br>')

        var e;
        document.write(e)
        document.write('<br>')

        // 변수의 자료형을 확인하는 내장 기능 typeof
        document.write( typeof(a)+ '<br>')
        document.write( typeof(b)+ '<br>')
        document.write( typeof(c)+ '<br>')
        document.write( typeof(d)+ '<br>')
        document.write( typeof(e)+ '<br>')

        // 당연하게 따옴표가 있으면 문자열
        var f ='5'
        document.write( typeof(f)+ '<br>')
        document.write('<hr>');
        

        var g =100;
        document.write('<br>')


        g= 'kim';
        document.write(g)
        document.write('<br>')


        //함수( 특정 기능의 코드가 써 있는 영역: 코드 덩어리)도 변수에 저장 할 수 있음
        var h = function(){
            document.write('hhh function...<br>')
        }

        document.write(h)// 함수 코드가 출력됨
        document.write('<br>')
        //실행 하려면 함수 이름을 호출해야 하는데..

        //변수 h 가 이 코드를 가지고 있으니 함수이름의 역할 을 할 수 있음

        h();
        // 함수를 저장한 변수의 타입도 확인 가능
        document.write( typeof(h) + '<br>')
        document.write('<hr>')

        //js에서 문자열 데이터를 값을 다루는 기능들을 멤버로 가진 객체(변수 + 함수)임.
        var s = "hello";
        document.write(s.length);//글자수를가진 멤버 변수
        document.write('<br>')

        document.write(s.toUpperCase())// 대문자로변경
        document.write('<br>')

        document.write(s.charAt(0))//문자열안에서 특정 문자열을 출력
        document.write('<br>')

        document.write(s.replace('h','k'))// 글자바꾸기 원본 불변
        document.write('<br>')
        
        document.write("<hr>")

        //사용자 정의 객체 만들어보기 맛보기(정식수업은 다음챕터에서)

        var person = {name:'sam', age:20, address:'seoul'}
        document.write('<p>');
        document.write('이름' + person.name + '<br>')      //멤버 변수 사용
        document.write('나이' + person.age + '<br>')
        document.write('주소' + person.address + '<br>')
        document.write('</p>');

        document.write("<hr>");


        // js 변수 키워드 var 의 특이한 규칙
        // var키워드 : 변수를 만들어라 라는 명령어

        var a =10;
        var a; //이미 선언된 변수명을 또 사용하면 var 키워드를무시한다.
        document.write(a); //10 
        document.write('<br>')
        

        //실수형 수치값을 표현하는 방법 중 지수표현법
        var b = 3.14
        document.write(b)
        document.write('<br>')


        b= 123.5e3; //123.5 * 10^3

        document.write(b); // 123500
        document.write('<br>')
        b= 123.5e-3 // 123.5 +10^-3(0.001)

        document.write(b);
        document.write('<br>')    

        // 권장하지 않지만. 변수를 만들때 파이썬 처럼 var 키워드 없어도 만들어짐
        name = 'sam'
        document.write(name);

        // var 없이 변수를 만들면 .전역변수가 됨(이는 함수 수업시간에 다시 소개 예정)




    </script>



</head>
<body>
    
</body>
</html>
