<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
    let num = prompt("숫자를 입력하세요");

    if(num !== null){
        num = parseInt(num);

        if(num % 4 === 0){
            document.write(`${num}은(는) 4의 배수입니다.`);
        }else{
            document.write(`${num}은(는) 4의 배수가 아닙니다.`);
        }
    }
    </script>
</head>
<body>
    
</body>
</html>
